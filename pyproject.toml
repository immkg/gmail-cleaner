[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail_cleaner"
version = "0.1.0"
authors = [
  { name = "Mayank Gupta", email = "mayankgupta690@gmail.com" },
]
description = "A powerful local CLI tool to sync, cluster, and surgically clean your Gmail."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pandas",
    "scikit-learn",
    "tqdm"
]

[project.scripts]
gmail-cleaner = "gmail_cleaner.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gmail_cleaner"]